name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
      - run: pnpm install --frozen-lockfile=false
      - run: uv sync --all-packages
      - run: node --test apps/web/tests/*.test.mjs
      - run: pnpm --filter @careerscout/web exec tsc --noEmit
      - run: pnpm --filter @careerscout/web lint
      - run: pnpm --filter @careerscout/web build

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: .venv/bin/python -m compileall -q apps
      - run: .venv/bin/python -m unittest discover -s apps/api/tests -v
      - run: .venv/bin/python -m unittest discover -s apps/ai-engine/tests -v
      - run: .venv/bin/python -m unittest discover -s apps/worker/tests -v
      - run: .venv/bin/python -m unittest discover -s apps/scheduler/tests -v
