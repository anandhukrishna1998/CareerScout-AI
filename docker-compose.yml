services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - careerscout_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/storage/cvs
    volumes:
      - cv_uploads:/app/storage/cvs
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - careerscout_net

  scraper-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - careerscout_net

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - careerscout_net

  ai-engine:
    build:
      context: .
      dockerfile: apps/ai-engine/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careerscout_net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerscout}
      POSTGRES_DB: ${POSTGRES_DB:-careerscout}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerscout} -d ${POSTGRES_DB:-careerscout}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - careerscout_net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - careerscout_net

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - careerscout_net

volumes:
  postgres_data:
  cv_uploads:

networks:
  careerscout_net:
    driver: bridge
