[project]
name = "careerscout-worker"
version = "0.1.0"
description = "CareerScout background worker"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.2.0",
  "pydantic>=2.9.2",
  "httpx>=0.27.2",
  "playwright>=1.48.0",
  "asyncpg>=0.30.0",
  "python-jobspy",
  "scrapy"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
